name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - hml
          - prd

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install pg @types/pg

      - name: Run Migration
        run: |
          if [ "${{ github.event.inputs.environment }}" == "hml" ]; then
            CONN_STRING="${{ secrets.SUPABASE_URL_HML }}"
          else
            CONN_STRING="${{ secrets.SUPABASE_URL_PRD }}"
          fi
          echo "Running migration..."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
