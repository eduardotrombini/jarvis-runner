name: Deploy HML

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Oracle Cloud
        uses: oci-cli/setup-@v3
        with:
          oci-cli-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          tenancy-id: ${{ secrets.OCI_TENANCY_ID }}
          user-id: ${{ secrets.OCI_USER_ID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}

      - name: Connect via SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HML_HOST }}
          username: ${{ secrets.HML_USERNAME }}
          key: ${{ secrets.HML_SSH_KEY }}
          script: |
            cd /opt/jarvis-runner
            git pull origin develop
            docker-compose -f docker-compose.hml.yml down
            docker-compose -f docker-compose.hml.yml build --no-cache
            docker-compose -f docker-compose.hml.yml up -d
