name: Deploy PRD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect via SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRD_HOST }}
          username: ${{ secrets.PRD_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TELEGRAM_BOT_TOKEN,STRAVA_CLIENT_ID,STRAVA_CLIENT_SECRET,STRAVA_REFRESH_TOKEN,SUPABASE_URL,SUPABASE_KEY,CALLBACK_URL
          script: |
            sudo apt-get update && sudo apt-get install -y docker.io docker-compose
            sudo git config --global --add safe.directory /opt/jarvis-runner
            cd /opt/jarvis-runner
            sudo tee .env > /dev/null << 'EOF'
            TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
            STRAVA_CLIENT_ID=$STRAVA_CLIENT_ID
            STRAVA_CLIENT_SECRET=$STRAVA_CLIENT_SECRET
            STRAVA_REFRESH_TOKEN=$STRAVA_REFRESH_TOKEN
            SUPABASE_URL=$SUPABASE_URL
            SUPABASE_KEY=$SUPABASE_KEY
            CALLBACK_URL=$CALLBACK_URL
            PORT=3001
            NODE_ENV=production
            EOF
            sudo git pull origin main
            sudo docker-compose -f docker-compose.prd.yml down || true
            sudo docker-compose -f docker-compose.prd.yml build --no-cache
            sudo docker-compose -f docker-compose.prd.yml up -d
