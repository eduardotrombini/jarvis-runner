name: Deploy PRD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect via SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRD_HOST }}
          username: ${{ secrets.PRD_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo git config --global --add safe.directory /opt/jarvis-runner
            cd /opt/jarvis-runner
            
            # Parar nginx docker se estiver rodando
            sudo docker stop nginx 2>/dev/null || true
            
            # Criar .env com HTTPS
            sudo tee .env > /dev/null << 'EOF'
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}
            STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}
            STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            CALLBACK_URL=https://jarvisbot.sytes.net
            PORT=3001
            NODE_ENV=production
            EOF
            
            # Configurar nginx do sistema para proxy
            sudo tee /etc/nginx/sites-available/jarvis > /dev/null << 'NGINX'
            server {
                listen 80;
                server_name jarvisbot.sytes.net;

                location / {
                    proxy_pass http://localhost:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINX
            
            sudo ln -sf /etc/nginx/sites-available/jarvis /etc/nginx/sites-enabled/
            sudo nginx -t && sudo systemctl reload nginx
            
            sudo git pull origin master
            sudo docker compose -f docker-compose.prd.yml down --remove-orphans || true
            sudo docker compose -f docker-compose.prd.yml build --no-cache
            sudo docker compose -f docker-compose.prd.yml up -d