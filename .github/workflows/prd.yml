name: Deploy PRD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect via SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRD_HOST }}
          username: ${{ secrets.PRD_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo git config --global --add safe.directory /opt/jarvis-runner
            cd /opt/jarvis-runner
            sudo tee .env > /dev/null << 'EOF'
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}
            STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}
            STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            CALLBACK_URL=http://jarvisbot.sytes.net
            PORT=3001
            NODE_ENV=production
            EOF
            sudo git pull origin master
            sudo docker ps -a --filter "name=jarvis" -q | xargs -r sudo docker rm -f || true
            sudo docker compose -f docker-compose.prd.yml down --remove-orphans || true
            sudo docker compose -f docker-compose.prd.yml build --no-cache
            sudo docker compose -f docker-compose.prd.yml up -d
